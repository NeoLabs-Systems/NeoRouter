name: neorouter
description: NeoRouter dashboard for Flutter web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
