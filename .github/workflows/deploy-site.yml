# Publishes the landing page at / and the GET /api reference at /api/
# (scripts/build_api_docs.js) to GitHub Pages, like NeoAgent's site.
name: Deploy Site

on:
  push:
    branches:
      - beta
    paths:
      - landing/**
      - server/routes/api_docs.js
      - server/core/capability_registry.js
      - server/services/routing/profiles.js
      - scripts/build_api_docs.js
      - package.json
      - package-lock.json
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build API docs
        run: npm run build:api-docs
        env:
          # Set a repository variable to show your own server in the examples.
          NEOROUTER_DOCS_ORIGIN: ${{ vars.NEOROUTER_DOCS_ORIGIN }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r landing/* _site/
          cp -r build/api-docs _site/api

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
