name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_web:
        description: Upload built web bundle for downstream release job
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  go:
    name: Go format, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-go@1cd3668653c972a8c10cffcf52be95638bba74f8

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        env:
          GOWORK: 'off'
        run: go vet ./...

      # staticcheck.conf at the repository root decides the enabled checks:
      # error texts are part of the API contract, so ST1005 and friends are off.
      - name: Staticcheck
        env:
          GOWORK: 'off'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Vulnerability check
        env:
          GOWORK: 'off'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Test
        env:
          GOWORK: 'off'
        run: go test -race -count=1 ./...

      - name: Static build
        env:
          CGO_ENABLED: '0'
          GOWORK: 'off'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/neorouter
          done
          go build -o /dev/null ./cmd/neorouter-release

  flutter-test:
    name: Flutter tests and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: flutter_app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: flutter_app
        run: flutter test --no-pub

      - name: Run browser-only widget tests
        working-directory: flutter_app
        env:
          CHROME_EXECUTABLE: google-chrome-stable
        run: flutter test --no-pub --platform chrome test/settings_layout_test.dart

      - name: Build web client
        uses: ./.github/actions/build-web

      - name: Upload CI web bundle
        if: ${{ inputs.upload_web == true }}
        uses: actions/upload-artifact@v4
        with:
          name: neorouter-ci-web-bundle
          path: flutter_app/build/web
          retention-days: 1
          if-no-files-found: error