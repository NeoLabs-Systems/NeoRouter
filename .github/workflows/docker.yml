# Builds the container image, proves it actually boots (health + dashboard) and
# publishes it to GHCR for pushes to main/beta and for version tags. Releases
# publish their own tag through _publish-docker-image.yml; this workflow is the
# per-push image and the pull-request gate.
name: Docker

on:
  push:
    branches:
      - main
      - beta
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - landing/**
      # The dashboard travels with the checkout, so a rebuilt bundle is a new image.
      - flutter_app/build/web/**
      - .github/workflows/docker.yml
    tags:
      - "v*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Each platform builds on its own native runner (arm64 used to be emulated,
# which took most of the time), is smoke-tested there, and is pushed by
# digest; the last job joins both into one multi-arch tag.
jobs:
  build:
    name: Build and smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registry names must be lowercase; the repository name is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The dashboard normally travels with the checkout. On a branch where it
      # has not been committed yet (the first run after the Go conversion), build
      # it here so the image step never fails on a missing directory.
      - name: Check the bundled dashboard
        id: web
        run: |
          if [ -f flutter_app/build/web/index.html ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.web.outputs.present != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build the dashboard
        if: steps.web.outputs.present != 'true'
        uses: ./.github/actions/build-web

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: neorouter:ci
          build-args: |
            NEOROUTER_CHANNEL=${{ github.ref_name == 'beta' && 'beta' || 'stable' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # A build that passes but does not start is worthless: the static web
      # bundle, the SQLite driver and the bind address only fail at runtime.
      - name: Smoke test
        run: |
          docker run -d --name neorouter-ci -p 4600:4600 neorouter:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4600/health; then break; fi
            if [ "$attempt" = 30 ]; then
              echo "The server did not become healthy:" >&2
              docker logs neorouter-ci >&2
              exit 1
            fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/app/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/app/main.dart.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/)" = "200"
          # The gateway must answer in the OpenAI error shape, not with a stack trace.
          curl -s -X POST http://127.0.0.1:4600/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model":"auto","messages":[]}' \
            | grep -q INVALID_API_KEY
          docker exec neorouter-ci neorouter version
          docker exec neorouter-ci neorouter healthcheck
          docker rm -f neorouter-ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything is cached from the build above, so this only uploads.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NEOROUTER_CHANNEL=${{ github.ref_name == 'beta' && 'beta' || 'stable' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Keep the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish multi-arch tags
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          # Word splitting is wanted: one -t per tag, one argument per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"