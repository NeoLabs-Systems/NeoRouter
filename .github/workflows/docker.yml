# Builds the container image, proves it actually boots (health + dashboard),
# and publishes it to GHCR for pushes to main/beta and for version tags.
name: Docker

on:
  push:
    branches:
      - main
      - beta
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - package.json
      - package-lock.json
      - server/**
      - shared/**
      - runtime/**
      - lib/**
      - bin/**
      - landing/**
      - .github/workflows/docker.yml
    tags:
      - "v*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write


concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Each platform builds on its own native runner (arm64 used to be emulated,
# which took most of the time), is smoke-tested there, and is pushed by
# digest; the last job joins both into one multi-arch tag.
jobs:
  build:
    name: Build and smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registry names must be lowercase; the repository name is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The image ships the dashboard that the Web Client workflow builds from
      # the same push: wait for it so the image never gets the previous one.
      - name: Wait for this commit's web client
        id: web
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web-client.yml --commit "$GITHUB_SHA" --json databaseId -q '.[0].databaseId')
          if [ -n "$run" ]; then gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10; else echo "No web client build for this commit."; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # The dashboard goes into the build as a file (the web-archive build
      # context), so the build itself downloads nothing from GitHub, whose
      # release links can time out for minutes. This commit's build comes from
      # its workflow artifact; otherwise the current release file, retried.
      - name: Dashboard from this commit's web client
        if: steps.web.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: neorouter-web
          path: web-archive/incoming
          run-id: ${{ steps.web.outputs.run }}
          github-token: ${{ github.token }}

      - name: Dashboard from the release
        if: steps.web.outputs.run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ (github.ref_name == 'beta' || github.base_ref == 'beta') && 'web-beta' || 'web-main' }}
        run: |
          mkdir -p web-archive/incoming
          for attempt in $(seq 1 20); do
            if gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern neorouter-web.tar.gz --dir web-archive/incoming --clobber; then exit 0; fi
            echo "Attempt $attempt failed; trying again in 15 seconds."
            sleep 15
          done
          exit 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The image with the downloaded dashboard. Without a target Docker
          # builds the last stage, runtime-from-source, which compiles Flutter.
          target: runtime
          build-contexts: web-archive=web-archive
          load: true
          tags: neorouter:ci
          # The dashboard matches the branch: main is stable, beta is beta.
          # NEOROUTER_WEB_STAMP makes the dashboard step run again instead of reusing a cached copy.
          build-args: |
            NEOROUTER_CHANNEL=${{ github.ref_name == 'beta' && 'beta' || 'stable' }}
            NEOROUTER_WEB_STAMP=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # A build that passes but does not start is worthless: the native modules,
      # the web client path and the bind address only fail at runtime.
      - name: Smoke test
        run: |
          docker run -d --name neorouter-ci -p 4600:4600 neorouter:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4600/health; then break; fi
            if [ "$attempt" = 30 ]; then
              echo "The server did not become healthy:" >&2
              docker logs neorouter-ci >&2
              exit 1
            fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/app/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/app/main.dart.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/)" = "200"
          # The gateway must answer in the OpenAI error shape, not with a stack trace.
          curl -s -X POST http://127.0.0.1:4600/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model":"auto","messages":[]}' \
            | grep -q INVALID_API_KEY
          docker exec neorouter-ci neorouter doctor
          docker rm -f neorouter-ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything is cached from the build above, so this only uploads.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-contexts: web-archive=web-archive
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NEOROUTER_CHANNEL=${{ github.ref_name == 'beta' && 'beta' || 'stable' }}
            NEOROUTER_WEB_STAMP=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Keep the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish multi-arch tags
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          # Word splitting is wanted: one -t per tag, one argument per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
