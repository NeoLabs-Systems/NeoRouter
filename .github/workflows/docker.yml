# Pull-request gate for the container: builds the image from the change and
# proves it boots, serves the dashboard and still answers the healthcheck of
# older compose files. Publishing belongs to the release workflows
# (_publish-docker-image.yml).
name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: NeoLabs-Systems/neolabs-go/.github/actions/setup-flutter@1cd3668653c972a8c10cffcf52be95638bba74f8
        with:
          pub-get: 'false'

      - name: Build web client
        uses: ./.github/actions/build-web

      # `runtime` is the stage older compose files name as their build target.
      - name: Build image
        run: docker build --target runtime -t neorouter:ci .

      # A build that passes but does not start is worthless: the static web
      # bundle, the SQLite driver and the bind address only fail at runtime.
      - name: Smoke test
        run: |
          docker run -d --name neorouter-ci -p 4600:4600 neorouter:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4600/health; then break; fi
            if [ "$attempt" = 30 ]; then
              echo "The server did not become healthy:" >&2
              docker logs neorouter-ci >&2
              exit 1
            fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/app/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/app/main.dart.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/)" = "200"
          # The gateway must answer in the OpenAI error shape, not with a stack trace.
          curl -s -X POST http://127.0.0.1:4600/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model":"auto","messages":[]}' \
            | grep -q INVALID_API_KEY
          docker exec neorouter-ci neorouter version
          docker exec neorouter-ci neorouter healthcheck
          docker exec neorouter-ci node -e "fetch('http://127.0.0.1:4600/health')"
          docker rm -f neorouter-ci
